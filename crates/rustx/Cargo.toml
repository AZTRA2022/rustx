[package]
name = "rustx-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
description = "What an application writes: a window, its pages, and nothing else."
keywords = ["gui", "desktop", "react", "native", "rsx"]
categories = ["gui", "web-programming"]

[dependencies]
rustx-dom = { path = "../rustx-dom", version = "0.1.0" }
rustx-engine = { path = "../rustx-engine", version = "0.1.0" }
rustx-macros = { package = "rustx-macro", path = "../rustx-macros", version = "0.1.0" }
# Ce que le web ne sait pas faire : le presse-papiers, les dialogues, les
# appareils. Un répertoire par système, à l'intérieur.
rustx-os = { path = "../rustx-os", version = "0.1.0" }
# Reexporte, pas utilise : une page ecrit `rustx::time::sleep` et ne
# nomme jamais tokio dans son `Cargo.toml`. C'est le meme runtime que
# celui de `rustx-engine`, par la meme version du workspace.
# `full`, et pas une liste choisie a la main : la facade reexporte
# tokio, donc elle reexporte tokio. Un developpeur qui ecrit
# `rustx::tokio::fs::write` ou un `#[rustx::main] async fn main`
# ecrit de l'async ordinaire, et une liste de features coupee en
# trois lui repondait « could not find `fs` in `tokio` » a propos
# d'une caisse qu'il n'a jamais nommee.
tokio = { version = "1.47", features = ["full"] }

[dev-dependencies]
# Pour lire les exemples du README et les compiler. Un exemple faux dans
# la documentation est un bug, et le seul moyen de le savoir est de
# passer le compilateur dessus.
rustx-compiler = { path = "../rustx-compiler", version = "0.1.0" }

# Publié sous `rustx-app`, parce que `rustx` est pris sur crates.io par
# un autre projet. La bibliothèque, elle, s'appelle `rustx` : un
# `cargo add rustx-app` et le code s'écrit `rustx::App`, comme tout ce
# qui est écrit ici et dans la documentation.
[lib]
name = "rustx"
path = "src/lib.rs"
