[package]
name = "rustx-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What an editor asks about a .rsx: where the mistakes are."

[dependencies]
rustx-compiler = { path = "../rustx-compiler" }

[dev-dependencies]
rustx-compiler = { path = "../rustx-compiler" }
# To prove that what is handed to rust-analyzer is a file a parser accepts.
syn = { version = "2", features = ["full", "parsing"] }
