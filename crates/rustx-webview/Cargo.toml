[package]
name = "rustx-webview"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
description = "The system-webview host of a rustx window: the wire protocol between the Rust tree and the page."
keywords = ["webview", "wry", "gui", "desktop", "rustx"]
categories = ["gui"]
publish = false

[dependencies]
rustx-dom = { path = "../rustx-dom", version = "0.5.0" }
# `open_url` hands an external link to the user's browser, and refuses any
# scheme but http, https and mailto.
rustx-os = { path = "../rustx-os", version = "0.5.0" }
serde_json = "1"
# The webview and window libraries Tauri is built on. Read in the pinned
# version, not from memory: wry 0.57 and tao 0.37.
wry = "0.57"
tao = "0.37"
# The reactor a `Future` waits on, as in the CEF engine: `rt-multi-thread`
# because the async threads are never the one that draws.
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
