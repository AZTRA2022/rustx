[package]
name = "rustx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
description = "rustx new, rustx dev, rustx build, rustx run."
keywords = ["cli", "gui", "desktop", "scaffolding", "rustx"]
categories = ["command-line-utilities", "development-tools", "gui"]

[[bin]]
name = "rustx"
path = "src/main.rs"

[lib]
name = "rustx_cli"
path = "src/lib.rs"

[dependencies]
rustx-compiler = { path = "../rustx-compiler", version = "0.1.0" }

[dev-dependencies]
rustx-dom = { path = "../rustx-dom", version = "0.1.0" }
