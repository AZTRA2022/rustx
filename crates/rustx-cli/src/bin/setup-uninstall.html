<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uninstall</title>
<style>
  :root { color-scheme: light dark; --fg: #16181d; --bg: #ffffff; --muted: #6b7280; --line: #e5e7eb; --accent: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f3f4f6; --bg: #14161a; --muted: #9ca3af; --line: #2a2e36; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { flex: 1; padding: 32px 36px 0; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .path { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; word-break: break-all; }
  footer { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 36px 24px; }
  button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="ask">
    <h1 id="title"></h1>
    <p class="sub">The application and its shortcut are removed. Your own documents are not touched.</p>
    <div class="path" id="where"></div>
  </section>
  <section id="done" hidden>
    <h1>Removed</h1>
    <p class="sub" id="gone"></p>
  </section>
  <section id="failed" hidden>
    <h1>It could not be removed</h1>
    <p class="sub" id="why"></p>
  </section>
</main>
<footer>
  <button id="cancel">Cancel</button>
  <button id="go" class="primary">Uninstall</button>
</footer>
<script>
  const $ = (id) => document.getElementById(id);
  const info = setup.info;
  document.title = "Uninstall " + info.name;
  $("title").textContent = "Uninstall " + info.name + "?";
  $("where").textContent = info.destination;
  const show = (id) => { for (const s of ["ask", "done", "failed"]) $(s).hidden = s !== id; };
  $("cancel").onclick = () => setup.cancel();
  $("go").onclick = () => { $("go").disabled = true; setup.uninstall(); };
  setup.on((e) => {
    if (e.event === "done") { show("done"); $("gone").textContent = info.name + " is removed."; $("go").hidden = true; $("cancel").textContent = "Close"; }
    if (e.event === "error") { show("failed"); $("why").textContent = e.message; $("go").hidden = true; $("cancel").textContent = "Close"; }
  });
</script>
</body>
</html>
