<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>rustx — hello</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        background: #16161a;
        color: #fffffe;
      }
      main {
        display: grid;
        gap: 1rem;
        justify-items: center;
      }
      h1 {
        margin: 0;
      }
      button {
        font: inherit;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 6px;
        background: #7f5af0;
        color: #fffffe;
        cursor: pointer;
      }
      button.quiet {
        background: #242629;
      }
      #out {
        font-size: 2.5rem;
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      #error {
        margin: 0;
        min-height: 1.2em;
        color: #ff8906;
        font-size: 0.9rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello world</h1>
      <p id="out">0</p>
      <button id="inc">Count</button>
      <div class="row">
        <button id="add" class="quiet">Add an item from Rust</button>
        <button id="panic" class="quiet">Panic in Rust</button>
        <button id="bad_args" class="quiet">Call it wrong</button>
      </div>
      <ul id="list"></ul>
      <!-- Hosts for the trees the mount scenario builds in Rust. -->
      <div id="tree"></div>
      <div id="empty"></div>
      <div id="fragment"></div>
      <div id="button"></div>
      <!-- Hosts for the re-render scenario. -->
      <div id="counter"></div>
      <div id="sibling"></div>
      <!-- Hosts for the lifecycle scenario. -->
      <div id="holder"></div>
      <div id="props"></div>
      <div id="rows"></div>
      <!-- The one host the router mounts its screens under. -->
      <div id="screens"></div>
      <!-- Host for the component that starts a background task. -->
      <div id="ticker"></div>

      <!-- The hosts of the `foreign` scenario: a node React owns, and
           one naming a component the page never registered. -->
      <div id="chart"></div>
      <div id="nope"></div>
      <p id="error"></p>
    </main>

    <script>
      // Every function called here is Rust, installed on this very context by
      // the render process. There is no bridge object and no message passing.
      const out = document.querySelector("#out");
      const error = document.querySelector("#error");

      document.querySelector("#inc").addEventListener("click", () => {
        out.textContent = rustx_count();
      });

      document.querySelector("#panic").addEventListener("click", () => {
        try {
          rustx_panic();
          error.textContent = "no exception was thrown";
        } catch (e) {
          error.textContent = String(e);
        }
      });

      document.querySelector("#bad_args").addEventListener("click", () => {
        try {
          rustx_needs_one();
          error.textContent = "no exception was thrown";
        } catch (e) {
          error.textContent = String(e);
        }
      });

      // The whole list below is built by Rust: the <li>, its text, its
      // class and its attachment to #list all happen on the Rust side.
      document.querySelector("#add").addEventListener("click", () => {
        try {
          rustx_add_item();
        } catch (e) {
          error.textContent = String(e);
        }
      });

      // Self-driving run, used by the test suite.
      const click = (selector) => document.querySelector(selector).click();

      // A scenario that throws must say so, not vanish.
      window.addEventListener("error", (event) => {
        try {
          rustx_report("js_error", String(event.message));
        } catch (_) {}
      });

      if (rustx_scenario() === "dom") {
        try {
        if (rustx_visit() === 1) {
          click("#add");
          rustx_report("last_item", document.querySelector("#list li:last-child").textContent);
          rustx_report("item_class", rustx_last_item_class());

          click("#add");
          rustx_report("item_count", String(rustx_count_items()));

          rustx_remove_last_item();
          rustx_report("count_after_remove", String(rustx_count_items()));

          // Hand Rust a node, then take its context away from under it.
          rustx_keep_node();
          location.reload();
        } else {
          try {
            rustx_use_kept_node();
            rustx_report("stale_error", "no exception was thrown");
          } catch (e) {
            rustx_report("stale_error", String(e));
          }
        }
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "local_only") {
        try {
          // A remote iframe: the engine must refuse the load, and the
          // context behind it must never receive a native function.
          const frame = document.createElement("iframe");
          frame.src = "https://example.com/";
          document.body.appendChild(frame);

          // And a navigation away from local content.
          location.href = "https://example.com/";

          setTimeout(() => {
            rustx_report("after_navigation", location.href);
            let blocked = "yes";
            try {
              // Same-origin access would throw for a loaded remote page;
              // a blocked one stays on the initial empty document.
              const inner = frame.contentDocument;
              if (inner && inner.location.href.startsWith("https://")) {
                blocked = "no";
              }
            } catch (_) {
              blocked = "no";
            }
            rustx_report("iframe_blocked", blocked);
            rustx_report("refusals", String(rustx_refusals()));
          }, 2500);
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "lifecycle") {
        try {
          rustx_mount_holder();
          rustx_mount_props();
          rustx_mount_rows();

          // A row leaves the keyed list. What it held has to go with it,
          // and nothing in the page says so: the render does.
          rustx_remove_row();
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              rustx_report("drops_after_row_left", rustx_row_drops());
            });
          });

          const row = () => document.querySelector("#row").textContent;

          // A re-render must keep what the component holds.
          document.querySelector("#holder").click();
          requestAnimationFrame(() => {
            rustx_report("dropped_after_rerender", rustx_drops());

            // A prop flowing in, twice.
            rustx_select(1);
            requestAnimationFrame(() => {
              rustx_report("after_prop_change", row());
              rustx_select(2);
              requestAnimationFrame(() => {
                rustx_report("prop_after_two_changes", row());

                // And now the component leaves.
                const before = Number(rustx_live_instances());
                rustx_unmount_holder();
                rustx_report("dropped", rustx_drops());
                rustx_report(
                  "live_after_unmount",
                  String(before - Number(rustx_live_instances()) - 1)
                );
              });
            });
          });
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "render") {
        try {
          rustx_mount_counter();
          rustx_mount_sibling();

          const shown = () => document.querySelector("#tick").textContent;
          document.querySelector("#tick").click();

          // One frame, and the click must be on screen.
          requestAnimationFrame(() => {
            rustx_report("after_one_click", shown());

            const before = Number(rustx_renders());
            rustx_flood();

            // Wait for all thousand to land, then one more frame to draw.
            let waited = 0;
            const settle = () => {
              if (rustx_counter_state() !== "1001" && ++waited < 600) {
                requestAnimationFrame(settle);
                return;
              }
              requestAnimationFrame(() => {
                rustx_report("renders_for_1000", String(Number(rustx_renders()) - before));
                rustx_report("shown_after_1000", shown());
                rustx_report("worker_final", rustx_counter_state());
                rustx_report("worker_shown", shown());
                rustx_report("sibling_renders", rustx_sibling_renders());
                rustx_report("untouched_sibling_text", document.querySelector("#fixed").textContent);
              });
            };
            requestAnimationFrame(settle);
          });
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      // The React side of the boundary, standing in for React itself:
      // what the engine is tested against is the contract — mount with
      // a name, a node and props, unmount before the node leaves — not
      // react-dom. The hybrid application of this plan's last task
      // brings the real one.
      window.__rustx_react = (() => {
        const components = {
          Chart: (node, props) => {
            let own = node.querySelector(".react-own");
            if (own === null) {
              own = document.createElement("span");
              own.className = "react-own";
              node.appendChild(own);
            }
            own.textContent = "chart of " + props.series;
          },
        };
        const state = { mounts: 0, unmounts: 0, order: [] };
        window.__rustx_react_state = state;
        return {
          mount(name, node, props) {
            const component = components[name];
            if (component === undefined) {
              return false;
            }
            if (node.querySelector(".react-own") === null) {
              state.mounts += 1;
              state.order.push("mount");
            }
            component(node, props);
            return true;
          },
          unmount(node) {
            state.unmounts += 1;
            // Said while the container is still in the document: that is
            // the whole point of being told first.
            state.order.push(node.isConnected ? "unmount-while-attached" : "unmount-detached");
            node.textContent = "";
            return true;
          },
        };
      })();

      if (rustx_scenario() === "foreign") {
        try {
          const chart = () => document.querySelector("#chart");
          const own = () => chart().querySelector(".react-own");
          const state = () => window.__rustx_react_state;
          const waitFor = (ready, then) => {
            const look = () => {
              if (!ready()) {
                requestAnimationFrame(look);
                return;
              }
              then();
            };
            look();
          };

          rustx_mount_chart();

          waitFor(() => own() !== null, () => {
            rustx_report("chart_text", own().textContent);

            // Something React put in the container that rustx knows
            // nothing about. A re-render must not take it away.
            const mark = document.createElement("b");
            mark.id = "react-mark";
            chart().querySelector("#rustx-js-chart").appendChild(mark);

            rustx_chart_series("b");
            waitFor(() => own().textContent === "chart of b", () => {
              rustx_report("chart_text_after_prop", own().textContent);
              rustx_report("react_mounts", String(state().mounts));
              rustx_report(
                "react_node_survived",
                document.querySelector("#react-mark") === null ? "no" : "yes"
              );

              // The container leaves the document. React has to be told
              // first, or its effects never clean up and its listeners
              // stay on a node nobody can reach.
              rustx_hide_chart();
              waitFor(() => state().unmounts > 0, () => {
                rustx_report("react_unmounted", "yes");
                rustx_report(
                  "unmount_came_first",
                  state().order.includes("unmount-while-attached") ? "yes" : "no"
                );
                rustx_report("given_back", rustx_given_back());

                rustx_mount_unknown_chart();
                setTimeout(() => {
                  rustx_report("unknown_component", rustx_foreign_complaint());
                  rustx_report("unknown_container_empty",
                    document.querySelector("#rustx-js-nope").textContent === "" ? "yes" : "no");

                  // The other direction: React owns a node, and asks
                  // rustx for a component to put inside it.
                  rustx_report("roots_before_mount", rustx_roots());
                  const owned = document.createElement("div");
                  owned.id = "react-owned";
                  document.querySelector("#chart").appendChild(owned);

                  rustx_component("Counter", "react-owned");
                  waitFor(() => document.querySelector("#inside-react") !== null, () => {
                    const inside = () => document.querySelector("#inside-react");
                    rustx_report("rustx_inside_react", inside().textContent);

                    inside().click();
                    waitFor(() => inside().textContent === "1", () => {
                      rustx_report("rustx_inside_react_after_click", inside().textContent);

                      // React takes its node back. What the component
                      // held goes with it.
                      rustx_release("react-owned");
                      setTimeout(() => {
                        rustx_report("released_inside_react", rustx_released_inside_react());
                        rustx_report("roots_after_release", rustx_roots());
                        try {
                          rustx_component("Nope", "react-owned");
                          rustx_report("unknown_rustx_component", "nothing was thrown");
                        } catch (e) {
                          rustx_report("unknown_rustx_component", String(e));
                        }

                        // Last: a boundary rendered while the page has
                        // no bridge at all. It must not stay empty for
                        // good — otherwise a `<script>` written after
                        // the host is an empty container nobody can
                        // explain. The engine holds it and hands it
                        // over on the frame the bridge appears.
                        const bridge = window.__rustx_react;
                        delete window.__rustx_react;
                        rustx_show_chart();
                        setTimeout(() => {
                          rustx_report(
                            "empty_while_no_bridge",
                            document.querySelector("#rustx-js-chart").textContent === ""
                              ? "yes"
                              : "no"
                          );
                          window.__rustx_react = bridge;
                          waitFor(
                            () => {
                              const box = document.querySelector("#rustx-js-chart");
                              return box !== null && box.textContent !== "";
                            },
                            () => rustx_report("handed_over_late", "yes")
                          );
                        }, 300);
                      }, 200);
                    });
                  });
                }, 300);
              });
            });
          });
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      // A navigation asked for before the router has mounted. A script
      // runs when the JavaScript context is created; the router waits for
      // its host element, which is a later frame. What is asked for in
      // between still has to happen.
      if (rustx_scenario() === "early_navigate") {
        try {
          rustx_navigate("/device/7");
          rustx_start_router();
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              rustx_report("screen", document.querySelector("#screen").textContent);
              rustx_report("path", rustx_route());

              // It was a navigation, so the starting screen is behind it.
              rustx_back();
              requestAnimationFrame(() =>
                requestAnimationFrame(() => {
                  rustx_report(
                    "after_back",
                    document.querySelector("#screen").textContent
                  );
                })
              );
            })
          );
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "router") {
        try {
          rustx_start_router();

          const screen = () => document.querySelector("#screen").textContent;
          const bar = () => document.querySelector("#bar").textContent;
          const frame = (then) => requestAnimationFrame(() => requestAnimationFrame(then));

          frame(() => {
            rustx_report("first_screen", screen());

            // Three clicks on the bar, which is the layout's own state.
            document.querySelector("#bar").click();
            document.querySelector("#bar").click();
            document.querySelector("#bar").click();

            frame(() => {
              // Read BEFORE any navigation. The layout is a child
              // component, and a child's own state changing has to
              // reach the screen on its own — not because a navigation
              // happened to re-render the root.
              rustx_report("layout_state_before_navigate", bar());

              rustx_navigate("/device/7");
              frame(() => {
                rustx_report("after_navigate", screen());
                // The bar is above both screens, so it kept counting.
                rustx_report("layout_state_after_navigate", bar());

                // Same page, other parameter.
                rustx_navigate("/device/8");
                frame(() => {
                  rustx_report("after_param_change", screen());
                  rustx_report("effect_order", rustx_effect_order());

                  // The home page was released when it was left: the
                  // task it held had to stop, and coming back has to
                  // build it from nothing rather than find it waiting.
                  setTimeout(() => {
                    rustx_report("left_page_task", rustx_page_task());
                    // One screen had two enclosing layouts, the other
                    // one. The bar is outermost in both, so it stays at
                    // depth 0 and was never rebuilt. Read here, before
                    // the detour through a path with no layout at all,
                    // where the bar legitimately leaves the screen.
                    rustx_report("bar_builds", rustx_bar_builds());

                    rustx_navigate("/nowhere");
                    frame(() => {
                      rustx_report("unknown_path", screen());

                      rustx_back();
                      frame(() => {
                        rustx_report("after_back", screen());

                        rustx_navigate_from_a_thread("/");
                        setTimeout(() => {
                          rustx_report("after_posted_navigate", screen());
                          rustx_report(
                            "left_page_released",
                            Number(rustx_home_builds()) > 1 ? "yes" : "no"
                          );
                          rustx_report("layout_task", rustx_layout_task());
                        }, 300);
                      });
                    });
                  }, 300);
                });
              });
            });
          });
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "task") {
        try {
          // Three threads: one endless task the scenario cancels by hand,
          // one held by a component that gets unmounted, and one that
          // panics the way a hardware thread eventually does.
          rustx_task_start();
          rustx_mount_ticker();
          rustx_task_panics();

          const framesBeforePanic = Number(rustx_frames());

          // Let them run, then take their tokens away.
          setTimeout(() => {
            rustx_report("ticks_while_running", rustx_task_ticks());
            rustx_report("running_before_cancel", rustx_task_running());
            rustx_task_cancel();
            rustx_unmount_ticker();

            // Cancellation is cooperative: each thread notices the next
            // time it looks, which is within a few milliseconds here.
            setTimeout(() => {
              rustx_report("task_stopped", rustx_task_stopped());
              rustx_report("post_after_cancel", rustx_task_post_after_cancel());
              rustx_report("task_after_unmount", rustx_task_after_unmount());
              rustx_report("task_panic_notice", rustx_task_panic_notice());
              rustx_report(
                "alive_after_task_panic",
                Number(rustx_frames()) > framesBeforePanic ? "yes" : "no"
              );
            }, 400);
          }, 400);
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "mount") {
        try {
          rustx_mount_tree();
          rustx_mount_empty();
          rustx_mount_fragment();
          rustx_mount_button();

          rustx_report("html", document.querySelector("#tree").innerHTML);
          rustx_report("empty_children", String(document.querySelector("#empty").childNodes.length));
          rustx_report("fragment_html", document.querySelector("#fragment").innerHTML);
          rustx_mount_fragment();
          rustx_report("after_second_mount", document.querySelector("#fragment").innerHTML);

          // The click goes through the DOM, as a user's would.
          document.querySelector("#mounted").click();
          rustx_report("clicked", rustx_clicks());
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "closing") {
        try {
          // The real shape of Review Focus #5: a thread that never stops
          // posting, and a window that closes under it.
          rustx_start_endless_thread();
          let frames = 0;
          const shut = () => {
            if (++frames < 30) {
              requestAnimationFrame(shut);
              return;
            }
            rustx_report("posted_before_closing", rustx_counter());
            rustx_report("closing", "yes");
            window.close();
          };
          requestAnimationFrame(shut);
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "subframe") {
        try {
          // Hand Rust a node of the main document, then give a sub-frame a
          // context of its own and take it away again. Neither the node nor
          // the job queue belonged to that sub-frame.
          rustx_keep_node();

          const panel = document.createElement("iframe");
          panel.src = "about:blank";
          document.body.appendChild(panel);

          requestAnimationFrame(() => {
            panel.remove();
            let waited = 0;
            const after = () => {
              if (++waited < 10) {
                requestAnimationFrame(after);
                return;
              }
              rustx_report("post_after_subframe", rustx_try_post());
              try {
                rustx_use_kept_node();
                rustx_report("kept_node_after_subframe", "usable");
              } catch (e) {
                rustx_report("kept_node_after_subframe", String(e));
              }
            };
            requestAnimationFrame(after);
          });
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "frame") {
        try {
          rustx_report("ui_thread", rustx_ui_thread());
          rustx_start_thread();

          // Wait for every posted update to land, then give the frame loop
          // one more frame to draw the result.
          let frames = 0;
          const settle = () => {
            if (rustx_counter() === "10000" || ++frames > 600) {
              requestAnimationFrame(finish);
            } else {
              requestAnimationFrame(settle);
            }
          };
          // Two panics on purpose — one in a posted job, one in a frame
          // callback — then five frames to see whether the loop survived.
          const finish = () => {
            rustx_frames_still_climbing();
            rustx_panic_in_job();
            rustx_panic_in_frame_callback();
            let waited = 0;
            const check = () => {
              if (++waited < 5) {
                requestAnimationFrame(check);
                return;
              }
              rustx_report("after_panicking_job", rustx_alive_since_check());
              rustx_report("callbacks_after_panic", rustx_callbacks_alive_since_check());
              report_rest();
            };
            requestAnimationFrame(check);
          };

          const report_rest = () => {
            rustx_report("frames", rustx_frames());
            rustx_report("counter", rustx_counter());
            rustx_report("shown", out.textContent);
            rustx_report("dom_writes", rustx_dom_writes());
            rustx_report("job_thread", rustx_job_thread());
            rustx_report("worker_thread", rustx_worker_thread());
            // Last, because it closes the queue for good.
            rustx_report("post_after_close", rustx_post_after_close());
          };
          requestAnimationFrame(settle);
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "no_boundary") {
        try {
          // Which process is the Rust in, and which process is V8 in?
          rustx_report("rust_pid", String(rustx_pid()));
          rustx_report("rust_role", rustx_role());

          // A value Rust cannot have known, written to the live document
          // and read straight back by Rust inside the same tick.
          const token = "tok-" + Math.random().toString(36).slice(2);
          const before = out.textContent;
          out.textContent = token;
          rustx_report("token", token);
          rustx_report("token_seen_by_rust", rustx_read_out());
          out.textContent = before;

          const mean = (fn, runs) => {
            const start = performance.now();
            for (let i = 0; i < runs; i++) fn();
            return ((performance.now() - start) * 1e6) / runs;
          };

          // The best of several batches, not one of them. The question
          // these figures answer is whether a call can be this fast —
          // whether an IPC boundary has come back — and a machine that
          // is busy with something else answers a different question.
          // One slow batch used to fail the whole suite.
          const best = (fn, runs, batches) => {
            for (let i = 0; i < 1000; i++) fn(); // warm up
            let lowest = Infinity;
            for (let batch = 0; batch < batches; batch++) {
              lowest = Math.min(lowest, mean(fn, runs));
            }
            return lowest;
          };

          rustx_report("call_ns", best(rustx_nop, 50000, 5).toFixed(1));
          rustx_report("dom_round_trip_ns", best(rustx_touch_dom, 5000, 5).toFixed(1));
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "natives") {
        click("#inc");
        click("#inc");
        rustx_report("count", out.textContent);

        click("#panic");
        rustx_report("panic_error", error.textContent);

        click("#inc");
        rustx_report("after_panic", out.textContent);

        click("#bad_args");
        rustx_report("bad_args_error", error.textContent);

        rustx_report("echo", rustx_echo("greet:bonjour", 7, true));

        // The other half of a badly typed call: the right number of
        // arguments, of a shape the engine does not carry.
        try {
          rustx_echo({ a: 1 });
          rustx_report("wrong_type_error", "no exception was thrown");
        } catch (e) {
          rustx_report("wrong_type_error", String(e));
        }

        // And a shape the engine does carry but the application does not
        // want: a number where it asked for a string.
        try {
          rustx_report(42, 43);
          rustx_report("wrong_type_app_error", "no exception was thrown");
        } catch (e) {
          rustx_report("wrong_type_app_error", String(e));
        }

        click("#inc");
        rustx_report("after_bad_types", out.textContent);
      }
    </script>
  </body>
