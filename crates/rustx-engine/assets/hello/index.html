<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>rustx — hello</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        background: #16161a;
        color: #fffffe;
      }
      main {
        display: grid;
        gap: 1rem;
        justify-items: center;
      }
      h1 {
        margin: 0;
      }
      button {
        font: inherit;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 6px;
        background: #7f5af0;
        color: #fffffe;
        cursor: pointer;
      }
      button.quiet {
        background: #242629;
      }
      #out {
        font-size: 2.5rem;
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      #error {
        margin: 0;
        min-height: 1.2em;
        color: #ff8906;
        font-size: 0.9rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello world</h1>
      <p id="out">0</p>
      <button id="inc">Count</button>
      <div class="row">
        <button id="add" class="quiet">Add an item from Rust</button>
        <button id="panic" class="quiet">Panic in Rust</button>
        <button id="bad_args" class="quiet">Call it wrong</button>
      </div>
      <ul id="list"></ul>
      <p id="error"></p>
    </main>

    <script>
      // Every function called here is Rust, installed on this very context by
      // the render process. There is no bridge object and no message passing.
      const out = document.querySelector("#out");
      const error = document.querySelector("#error");

      document.querySelector("#inc").addEventListener("click", () => {
        out.textContent = rustx_count();
      });

      document.querySelector("#panic").addEventListener("click", () => {
        try {
          rustx_panic();
          error.textContent = "no exception was thrown";
        } catch (e) {
          error.textContent = String(e);
        }
      });

      document.querySelector("#bad_args").addEventListener("click", () => {
        try {
          rustx_needs_one();
          error.textContent = "no exception was thrown";
        } catch (e) {
          error.textContent = String(e);
        }
      });

      // The whole list below is built by Rust: the <li>, its text, its
      // class and its attachment to #list all happen on the Rust side.
      document.querySelector("#add").addEventListener("click", () => {
        try {
          rustx_add_item();
        } catch (e) {
          error.textContent = String(e);
        }
      });

      // Self-driving run, used by the test suite.
      const click = (selector) => document.querySelector(selector).click();

      // A scenario that throws must say so, not vanish.
      window.addEventListener("error", (event) => {
        try {
          rustx_report("js_error", String(event.message));
        } catch (_) {}
      });

      if (rustx_scenario() === "dom") {
        try {
        if (rustx_visit() === 1) {
          click("#add");
          rustx_report("last_item", document.querySelector("#list li:last-child").textContent);
          rustx_report("item_class", rustx_last_item_class());

          click("#add");
          rustx_report("item_count", String(rustx_count_items()));

          rustx_remove_last_item();
          rustx_report("count_after_remove", String(rustx_count_items()));

          // Hand Rust a node, then take its context away from under it.
          rustx_keep_node();
          location.reload();
        } else {
          try {
            rustx_use_kept_node();
            rustx_report("stale_error", "no exception was thrown");
          } catch (e) {
            rustx_report("stale_error", String(e));
          }
        }
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "no_boundary") {
        try {
          // Which process is the Rust in, and which process is V8 in?
          rustx_report("rust_pid", String(rustx_pid()));
          rustx_report("rust_role", rustx_role());

          // V8's own process, read the only way a page can: by asking a
          // native function that is itself part of this context.
          window.__v8_pid = rustx_pid();
          rustx_report("v8_pid", String(window.__v8_pid));

          const mean = (fn, runs) => {
            for (let i = 0; i < 1000; i++) fn(); // warm up
            const start = performance.now();
            for (let i = 0; i < runs; i++) fn();
            return ((performance.now() - start) * 1e6) / runs;
          };

          rustx_report("call_ns", mean(rustx_nop, 200000).toFixed(1));
          rustx_report("dom_round_trip_ns", mean(rustx_touch_dom, 20000).toFixed(1));
        } catch (e) {
          rustx_report("scenario_error", String(e));
        }
      }

      if (rustx_scenario() === "natives") {
        click("#inc");
        click("#inc");
        rustx_report("count", out.textContent);

        click("#panic");
        rustx_report("panic_error", error.textContent);

        click("#inc");
        rustx_report("after_panic", out.textContent);

        click("#bad_args");
        rustx_report("bad_args_error", error.textContent);

        rustx_report("echo", rustx_echo("greet:bonjour", 7, true));
      }
    </script>
  </body>
</html>
