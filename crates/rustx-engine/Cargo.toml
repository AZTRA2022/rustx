[package]
name = "rustx-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
description = "The CEF host a rustx window is drawn by: the frame loop, the router, the React boundary."
keywords = ["cef", "chromium", "gui", "desktop", "rustx"]
categories = ["gui", "api-bindings"]

[dependencies]
# `sandbox` is on by default and builds the CEF wrapper with USE_SANDBOX=ON,
# which obliges the host to create Windows sandbox info and hand it to
# execute_process and initialize. rustx does not: the render process runs the
# application's own Rust code and is deliberately unsandboxed (see the design
# document, §7.1), which is only defensible because the engine refuses remote
# content. Left on, every sandboxed sub-process dies with an access violation
# and Chromium falls back to software rendering after a visible blank window.
cef = { version = "156.2.0", default-features = false, features = ["resources"] }
rustx-dom = { path = "../rustx-dom", version = "0.1.0" }
# Le reacteur qu'un `Future` attend. `rt-multi-thread` parce que les
# threads de l'async ne sont jamais celui du rendu ; `time` et `net`
# parce qu'un timer et une socket sont ce que les bibliotheques de
# l'ecosysteme enregistrent aupres de lui.
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "time", "net", "sync", "macros"] }

