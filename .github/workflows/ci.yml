# The gates, on every push.
#
# `scripts/gates.ps1` is the same set of gates run by hand; this file
# is where they are enforced.
#
# Three things are worth knowing about the shape of this file.
#
# **Windows is the primary job.** It is the platform `rustx-os` is
# written and measured on, and the only one on which an application has
# ever been run. The gates run there in full.
#
# **The macOS and Linux jobs compile what they can, and no more.** The
# framework draws with CEF, which the `cef` crate fetches and links on
# first build; the crates that do not touch it are compiled on all three
# platforms, and that is deliberately the whole claim. `rustx-os`
# matters most here: `lib.rs` compile-checks the other platforms'
# modules through a `mod *_also_compiles` trick so a Windows build
# catches their syntax errors, but a trick is not a target. These jobs
# build those halves with the compiler that actually targets them.
#
# **A gate that cannot run is not a gate that passed.** Nothing here is
# allowed to continue on error, and nothing reports success for a step
# it skipped.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer
# irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing until something panics, and a panic
  # without one is a bug report nobody can act on.
  RUST_BACKTRACE: 1
  # There is no GPU on a CI runner. Without this, every application
  # fails in a way that looks like a defect in the application.
  RUSTX_SOFTWARE: "1"

jobs:
  # ------------------------------------------------------------- windows
  #
  # The real platform: formatting, lints, the whole workspace, every
  # test, the doc build and the packaging check.
  windows:
    name: gates (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # CEF is large and its build is the slowest thing here.
          key: windows-gates

      # Run the same script a developer runs, so that the two cannot
      # drift apart. `pwsh` is the shell on purpose: Git Bash puts its
      # own `link` ahead of MSVC's on the `PATH` and every native build
      # started from bash fails at the linker.
      - name: The gates
        shell: pwsh
        run: ./scripts/gates.ps1 -Only fmt,clippy,build,test,docs,package

  # ----------------------------------------------------- other platforms
  #
  # What compiles away from Windows. See the note at the top: this is a
  # narrower claim than "rustx works on Linux", and it is the only one
  # these jobs are entitled to make.
  portable:
    name: compiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-${{ matrix.os }}

      # The platform half that a Windows build only ever compile-checked
      # by proxy, built by the compiler that actually targets it. If
      # `rustx-os` is going to claim macOS and Linux support one day,
      # this is the job that has to be green first.
      - name: rustx-os, for this platform
        run: cargo check -p rustx-os --all-targets

      - name: rustx-os, its own tests
        run: cargo test -p rustx-os

      # The compiler, the DOM, the macros and the language server are
      # plain Rust: they have no business being platform-dependent, and
      # if they are, that is the bug this step finds.
      - name: The platform-independent crates
        run: |
          cargo test -p rustx-compiler
          cargo test -p rustx-dom
          cargo test -p rustx-macros
          cargo test -p rustx-lsp

      - name: No clippy warning in them either
        run: |
          cargo clippy -p rustx-os -p rustx-compiler -p rustx-dom \
            -p rustx-macros -p rustx-lsp --all-targets -- -D warnings

  # ----------------------------------------------------------- installers
  #
  # The one job that answers "does this framework ship software?" on
  # each operating system, by doing it: build an application, run
  # `rustx package`, and check that what came out is the native
  # installer that platform's users double-click.
  #
  # It is a job of its own rather than a step of the gates because it
  # is the only one that needs CEF to build away from Windows, which
  # has never been done -- and a red job here says exactly that,
  # instead of hiding inside a longer one.
  installers:
    name: it ships (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: installers-${{ matrix.os }}

      # Chromium links against these on a desktop Linux, and a runner
      # is not a desktop. The same list the `.deb` declares as its
      # `Depends`, which is the point: if this step is wrong, the
      # package's dependencies are wrong too.
      - name: What Chromium links against (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libgbm1 libasound2t64 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libxext6 \
            libpango-1.0-0 libcairo2

      # The tool that turns the generated script into a setup `.exe`.
      # Without it `rustx package` writes the script and says so, which
      # is correct behaviour and not what this job is here to prove.
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # `rustx package` looks in Program Files and in the per-user
          # Programs folder; chocolatey installs machine-wide.
          Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Package the example application
        shell: bash
        working-directory: apps/counter
        run: cargo run -p rustx-cli --bin rustx -- package --release --out ../../dist

      # What each platform must have produced. A missing file fails
      # here, with the directory listed, rather than leaving a green
      # tick over an empty folder.
      - name: The installer is there
        shell: bash
        run: |
          set -eu
          ls -la dist/
          case "${{ runner.os }}" in
          Windows)
            ls dist/*-setup.exe
            ;;
          Linux)
            ls dist/*.deb
            # Our `.deb` is written by hand -- no `dpkg-deb` is
            # involved in making it -- so this is the first thing that
            # reads it with the real tool. `-I` parses the control
            # archive, `-c` walks the data tarball, and either one
            # fails on a malformed ar member, a bad tar checksum or a
            # field `dpkg` does not accept.
            dpkg-deb -I dist/*.deb
            dpkg-deb -c dist/*.deb | head -20
            # And it installs, which is the only check that covers the
            # paths, the modes and the symbolic link all at once.
            sudo dpkg -i dist/*.deb
            test -x /usr/bin/counter
            test -f /usr/share/applications/counter.desktop
            desktop-file-validate /usr/share/applications/counter.desktop
            sudo dpkg -r counter
            ;;
          macOS)
            ls dist/*.pkg || ls dist/*.dmg
            # `pkgutil` reads the receipt the installer would write,
            # which is what tells us the `.pkg` is addressable rather
            # than merely present.
            if [ -f dist/*.pkg ]; then pkgutil --payload-files dist/*.pkg | head -20; fi
            ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          # The folder is 400 MB and the archive is already in it; only
          # what a user would download goes up.
          path: |
            dist/*-setup.exe
            dist/*.deb
            dist/*.pkg
            dist/*.dmg
            dist/*.iss
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- tooling
  editor:
    name: the editor extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci
        working-directory: editors/vscode

      - name: It typechecks
        run: npx tsc --noEmit
        working-directory: editors/vscode

      - name: It builds
        run: node build.mjs
        working-directory: editors/vscode

      # Including `test/hardcases.test.mjs`, which is the suite that
      # asserts the extension cannot be made to throw, hang, or lose a
      # character of somebody's file.
      - name: Its tests pass
        run: npm test
        working-directory: editors/vscode

  site:
    name: the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - name: It typechecks
        run: npx tsc --noEmit
        working-directory: site

      # Every `.mdx` page is compiled here, so a broken component or a
      # malformed page fails the build rather than the reader.
      - name: Every page builds
        run: npx next build
        working-directory: site
