# The gates, on every push.
#
# `scripts/gates.ps1` is the same set of gates run by hand; this file
# is where they are enforced.
#
# Three things are worth knowing about the shape of this file.
#
# **Windows is the primary job.** It is the platform `rustx-os` is
# written and measured on, and the only one on which an application has
# ever been run. The gates run there in full.
#
# **The macOS and Linux jobs compile, and run what a runner can.** The
# framework draws with the system's webview (WebView2, WKWebView,
# WebKitGTK through wry); a Linux runner has no desktop, so its page
# tests run under Xvfb. Whether that is enough is what the first runs
# will say -- these jobs were written on Windows and not yet run. `rustx-os`
# matters most here: `lib.rs` compile-checks the other platforms'
# modules through a `mod *_also_compiles` trick so a Windows build
# catches their syntax errors, but a trick is not a target. These jobs
# build those halves with the compiler that actually targets them.
#
# **A gate that cannot run is not a gate that passed.** Nothing here is
# allowed to continue on error, and nothing reports success for a step
# it skipped.

name: ci

on:
  # Une branche ouverte en pull request est deja testee par l'evenement
  # d'en dessous : la tester aussi sur chaque poussee faisait tourner la
  # matrice entiere deux fois, et le groupe de concurrence ci-dessous
  # n'y peut rien -- les deux evenements n'ont pas la meme reference.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer
# irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing until something panics, and a panic
  # without one is a bug report nobody can act on.
  RUST_BACKTRACE: 1
  # There is no GPU on a CI runner. Without this, every application
  # fails in a way that looks like a defect in the application.
  RUSTX_SOFTWARE: "1"

jobs:
  # ------------------------------------------------------------- windows
  #
  # The real platform: formatting, lints, the whole workspace, every
  # test, the doc build and the packaging check.
  windows:
    name: gates (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gates

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Eight of the example applications declare JavaScript libraries,
      # and the compiler refuses to bundle one whose `node_modules` is
      # absent -- rightly, since the application would not run. A
      # developer has them installed; a runner starts without them, so
      # the whole workspace fails to build until this step has run.
      - name: What the example applications declare
        shell: bash
        run: |
          set -eu
          for manifest in apps/*/package.json; do
            (cd "$(dirname "$manifest")" && npm ci --no-audit --no-fund)
          done

      # Run the same script a developer runs, so that the two cannot
      # drift apart. `pwsh` is the shell on purpose: Git Bash puts its
      # own `link` ahead of MSVC's on the `PATH` and every native build
      # started from bash fails at the linker.
      - name: The gates
        shell: pwsh
        run: ./scripts/gates.ps1 -Only fmt,clippy,build,test,docs,package

  # ----------------------------------------------------- other platforms
  #
  # What compiles away from Windows. See the note at the top: this is a
  # narrower claim than "rustx works on Linux", and it is the only one
  # these jobs are entitled to make.
  portable:
    name: compiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-${{ matrix.os }}

      # `notify-send` is what carries a notification on Linux, and a
      # runner has no desktop, so nothing installed it.
      - name: What a notification needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnotify-bin

      # The platform half that a Windows build only ever compile-checked
      # by proxy, built by the compiler that actually targets it. If
      # `rustx-os` is going to claim macOS and Linux support one day,
      # this is the job that has to be green first.
      # wry's Linux backend: WebKitGTK 4.1 and what tao draws with.
      - name: What the system webview needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev xvfb

      - name: rustx-os, for this platform
        run: cargo check -p rustx-os --all-targets

      - name: The webview host, for this platform
        run: cargo check -p rustx-webview --all-targets

      # A hosted Mac can open windows; if this ever cannot, the log says why.
      - name: The webview host, its tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test -p rustx-webview -- --test-threads=1

      # Numbers for the one thing that differs on the hosted Mac: see the test.
      - name: What the Mac says about the window's size
        if: runner.os == 'macOS'
        run: cargo test -p rustx-webview --test page -- --test-threads=1 --nocapture macos_size_diagnostic

      - name: The webview host, its tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p rustx-webview

      # Retried once: a macOS runner sometimes cannot fork the next test binary
      # ("Resource temporarily unavailable") after the device tests.
      - name: rustx-os, its own tests
        run: cargo test -p rustx-os || cargo test -p rustx-os -- --test-threads=1

      # The compiler, the DOM, the macros and the language server are
      # plain Rust: they have no business being platform-dependent, and
      # if they are, that is the bug this step finds.
      - name: The platform-independent crates
        run: |
          cargo test -p rustx-compiler
          cargo test -p rustx-dom
          cargo test -p rustx-macro
          cargo test -p rustx-lsp

      - name: No clippy warning in them either
        run: |
          cargo clippy -p rustx-os -p rustx-compiler -p rustx-dom \
            -p rustx-macro -p rustx-lsp --all-targets -- -D warnings

  # ----------------------------------------------------------- installers
  #
  # The one job that answers "does this framework ship software?" on
  # each operating system, by doing it: build an application, run
  # `rustx package`, and check that what came out is the native
  # installer that platform's users double-click.
  #
  # It is a job of its own rather than a step of the gates because it
  # builds away from Windows with the system webview, which has not
  # been run on a runner yet -- and a red job here says exactly that,
  # instead of hiding inside a longer one.
  installers:
    name: it ships (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: installers-${{ matrix.os }}

      # The webview the `.deb` depends on (libwebkit2gtk-4.1-0 comes with
      # the dev package), and `desktop-file-validate` for what it installs.
      - name: What the system webview needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev             desktop-file-utils xvfb

      - name: Package the example application
        shell: bash
        working-directory: apps/counter
        run: cargo run -p rustx-cli --bin rustx -- package --out ../../dist

      # What each platform must have produced. A missing file fails
      # here, with the directory listed, rather than leaving a green
      # tick over an empty folder.
      - name: The installer is there
        shell: bash
        timeout-minutes: 10
        run: |
          set -eu
          ls -la dist/
          case "${{ runner.os }}" in
          Windows)
            ls dist/counter-*-windows/counter.exe
            ;;
          Linux)
            ls dist/*.deb
            # Our `.deb` is written by hand -- no `dpkg-deb` is
            # involved in making it -- so this is the first thing that
            # reads it with the real tool. `-I` parses the control
            # archive, `-c` walks the data tarball, and either one
            # fails on a malformed ar member, a bad tar checksum or a
            # field `dpkg` does not accept.
            dpkg-deb -I dist/*.deb
            dpkg-deb -c dist/*.deb | head -20
            # And it installs, which is the only check that covers the
            # paths, the modes and the symbolic link all at once.
            sudo dpkg -i dist/*.deb
            test -x /usr/bin/counter
            test -f /usr/share/applications/counter.desktop
            desktop-file-validate /usr/share/applications/counter.desktop
            # It starts, and stays up, on a virtual display.
            xvfb-run -a /usr/bin/counter &
            pid=$!
            sleep 8
            kill -0 $pid
            kill $pid || true
            sudo dpkg -r counter
            ;;
          macOS)
            ls dist/*.pkg || ls dist/*.dmg
            # `pkgutil` reads the receipt the installer would write,
            # which is what tells us the `.pkg` is addressable rather
            # than merely present.
            if [ -f dist/*.pkg ]; then pkgutil --payload-files dist/*.pkg | head -20; fi
            # The project's own screens (apps/counter/installer/*.html) are in the
            # package's resources: productbuild wrapped the component.
            pkgutil --expand dist/*.pkg "$RUNNER_TEMP/expanded"
            ls "$RUNNER_TEMP/expanded/Resources"
            test -f "$RUNNER_TEMP/expanded/Resources/welcome.html"
            # Install it, and start what was installed.
            if [ -f dist/*.pkg ]; then
              sudo installer -pkg dist/*.pkg -target /
              test -d /Applications/Counter.app
              binary=$(ls /Applications/Counter.app/Contents/MacOS/* | head -1)
              "$binary" 2> "$RUNNER_TEMP/app.err" &
              pid=$!
              sleep 8
              cat "$RUNNER_TEMP/app.err" || true
              kill -0 $pid
              kill $pid || true
            fi
            ;;
          esac

      # The packaged binary is its own installer: it shows the install wizard
      # (system/install.rsx, the framework's default here), a scenario clicks
      # Install, and the installed copy starts, then removes itself.
      - name: The app installs itself
        shell: bash
        timeout-minutes: 10
        run: |
          set -eu
          # Git Bash turns a value that looks like /path into a Windows path.
          export MSYS_NO_PATHCONV=1
          home="$RUNNER_TEMP/selfinstall"
          mkdir -p "$home/local" "$home/roam" "$home/home"
          report="$home/report.txt"
          case "${{ runner.os }}" in
          Windows)
            export LOCALAPPDATA="$(cygpath -w "$home/local")" APPDATA="$(cygpath -w "$home/roam")"
            exe=$(ls dist/counter-*-windows/counter.exe)
            installed="$LOCALAPPDATA/Programs/Counter/counter.exe"
            runner=""
            ;;
          Linux)
            export HOME="$home/home"
            exe=$(ls dist/counter-*-linux/counter)
            installed="$HOME/.local/share/counter/counter"
            runner="xvfb-run -a"
            ;;
          macOS)
            export HOME="$home/home"
            exe=$(ls -d dist/counter-*-macos/Counter.app)/Contents/MacOS/counter
            installed="$HOME/Applications/Counter.app/Contents/MacOS/counter"
            runner=""
            ;;
          esac
          $runner "$exe" --scenario=install --report="$report" &
          pid=$!
          for i in $(seq 1 90); do grep -q "done=" "$report" 2>/dev/null && break; sleep 1; done
          kill $pid || true
          cat "$report"
          grep -q "done=yes" "$report"
          # The licence step showed the LICENSE carried in the single exe.
          grep -q "licence=Licence" "$report"
          grep -q "licence_text=.*Counter sample licence" "$report"
          test -f "$installed"
          # The installed copy starts and stays up.
          $runner "$installed" &
          pid=$!
          sleep 8
          kill -0 $pid
          kill $pid || true
          sleep 2
          # The OS-facing screens of system/ open from the installed copy.
          for screen in about license permissions settings; do
            rm -f "$home/screen.txt"
            RUSTX_START="/__system/$screen" $runner "$installed" --scenario=screen --report="$home/screen.txt" &
            pid=$!
            for i in $(seq 1 60); do grep -q "done=" "$home/screen.txt" 2>/dev/null && break; sleep 1; done
            kill $pid || true
            sleep 6
            cat "$home/screen.txt"
            grep -q "done=yes" "$home/screen.txt"
          done
          # A picture of each OS-facing screen, for a person to look at: no Mac or Windows needed.
          shots="$PWD/screens"
          mkdir -p "$shots"
          shoot() {
            case "${{ runner.os }}" in
            Windows)
              powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.SystemInformation]::VirtualScreen; \$m=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; \$g=[System.Drawing.Graphics]::FromImage(\$m); \$g.CopyFromScreen(\$b.Location,[System.Drawing.Point]::Empty,\$b.Size); \$m.Save('$(cygpath -w "$1")')" ;;
            macOS) screencapture -x "$1" ;;
            Linux) import -window root "$1" ;;
            esac
          }
          for screen in install uninstall update license permissions about settings; do
            rm -f "$home/screen.txt"
            if [ "${{ runner.os }}" = "Linux" ]; then
              # One X server for the app and the picture.
              export SHOT="$shots/$screen.png" INSTALLED="$installed" SCREEN="$screen" REPORT="$home/screen.txt"
              xvfb-run -a -s "-screen 0 1280x800x24" bash -c 'RUSTX_START="/__system/$SCREEN" "$INSTALLED" --scenario=screen --report="$REPORT" & p=$!; for i in $(seq 1 60); do grep -q "done=" "$REPORT" 2>/dev/null && break; sleep 1; done; sleep 2; import -window root "$SHOT"; kill $p || true'
            else
              RUSTX_START="/__system/$screen" "$installed" --scenario=screen --report="$home/screen.txt" &
              pid=$!
              for i in $(seq 1 60); do grep -q "done=" "$home/screen.txt" 2>/dev/null && break; sleep 1; done
              sleep 2
              shoot "$shots/$screen.png" || echo "no picture for $screen"
              kill $pid || true
              sleep 6
            fi
            grep -q "done=yes" "$home/screen.txt"
          done
          ls -l "$shots"
          # Settings checks for updates against a release page served over loopback.
          site="$home/releases"
          mkdir -p "$site/repos/owner/counter/releases"
          printf '%s' '{"tag_name":"v9.0.0","body":"new","assets":[{"name":"counter-windows-linux-macos.zip","browser_download_url":"http://127.0.0.1:8765/x.zip","size":4}]}' > "$site/repos/owner/counter/releases/latest"
          (cd "$site" && $(command -v python3 || command -v python) -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &) 
          sleep 2
          rm -f "$home/screen.txt"
          RUSTX_UPDATE_API="http://127.0.0.1:8765" RUSTX_START="/__system/settings" $runner "$installed" --scenario=update --report="$home/screen.txt" &
          pid=$!
          for i in $(seq 1 60); do grep -q "done=" "$home/screen.txt" 2>/dev/null && break; sleep 1; done
          kill $pid || true
          sleep 4
          cat "$home/screen.txt"
          grep -q "update=found" "$home/screen.txt"
          # And removes itself.
          "$installed" --uninstall --silent
          for i in $(seq 1 30); do [ -e "$installed" ] || break; sleep 1; done
          test ! -e "$installed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.os }}
          path: screens/*.png
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          # The folder is in the archive already; only
          # what a user would download goes up.
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.pkg
            dist/*.dmg
            dist/*.iss
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- tooling
  editor:
    name: the editor extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci
        working-directory: editors/vscode

      - name: It typechecks
        run: npx tsc --noEmit
        working-directory: editors/vscode

      - name: It builds
        run: node build.mjs
        working-directory: editors/vscode

      # Including `test/hardcases.test.mjs`, which is the suite that
      # asserts the extension cannot be made to throw, hang, or lose a
      # character of somebody's file.
      - name: Its tests pass
        run: npm test
        working-directory: editors/vscode

  site:
    name: the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      # Every `.mdx` page is compiled here, so a broken component or a
      # malformed page fails the build rather than the reader. It runs
      # before the typecheck because it is what writes `next-env.d.ts`,
      # which is where the `.webp` imports get their declarations.
      - name: Every page builds
        run: npx next build
        working-directory: site

      - name: It typechecks
        run: npx tsc --noEmit
        working-directory: site
