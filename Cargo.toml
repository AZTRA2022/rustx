[workspace]
resolver = "3"
members = ["apps/catalogue", "apps/capture", "apps/hybrid", "apps/counter", "apps/monitor", "apps/zoo", "crates/rustx", "crates/rustx-compiler", "crates/rustx-dom", "crates/rustx-engine", "crates/rustx-cli",
 "crates/rustx-lsp", "crates/rustx-macros", "crates/rustx-os"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024, so 1.85 is the floor. Said out loud, because a compiler
# error about an edition is a worse way to learn it than a refusal that
# names the version.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AZTRA2022/rustx"
homepage = "https://github.com/AZTRA2022/rustx"
readme = "README.md"
authors = ["aztra"]
