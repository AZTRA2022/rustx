[workspace]
resolver = "3"
members = ["apps/catalogue", "apps/capture", "apps/hybrid", "apps/counter", "apps/monitor", "apps/zoo", "apps/agent-manager", "apps/data-intel", "apps/vault-storage", "apps/ops-monitor", "apps/multitask-hub", "apps/utility-hub", "apps/nemo-design", "apps/video-editor", "crates/rustx", "crates/rustx-compiler", "crates/rustx-dom", "crates/rustx-cli",
 "crates/rustx-lsp", "crates/rustx-macros", "crates/rustx-os", "crates/rustx-webview"]

[workspace.package]
version = "0.5.0"
edition = "2024"
# Edition 2024, so 1.85 is the floor. Said out loud, because a compiler
# error about an edition is a worse way to learn it than a refusal that
# names the version.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AZTRA2022/rustx"
homepage = "https://github.com/AZTRA2022/rustx"
readme = "README.md"
authors = ["aztra"]

# Debug info is most of what a debug build writes and links. Line tables keep
# backtraces and breakpoints by line, and make `target` and linking much smaller.
[profile.dev]
debug = "line-tables-only"
