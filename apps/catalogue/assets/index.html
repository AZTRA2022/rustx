<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Catalogue</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        background: #16161a;
        color: #fffffe;
      }
      .devices { padding-left: 1.2rem; }
      button {
        font: inherit;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 6px;
        background: #7f5af0;
        color: #fffffe;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- The page is written in app/page.rsx. Nothing below is. -->
    <div id="app"></div>
    <script>
      // A scenario waits on time, not on a frame.
      //
      // `requestAnimationFrame` never fires on a machine whose
      // compositor produces no frames — a GPU process that crashes on
      // every start, a window the system has hidden — and a scenario
      // that polled with it waited for ever while the application
      // underneath it was working perfectly. The framework drives its
      // own frames from a timer when that happens; so does this.
      const rustx_soon = (then) => setTimeout(then, 16);
      if (rustx_scenario() === "page") {
        const root = document.querySelector("#app");
        const settle = () => {
          if (!root.firstChild) {
            rustx_soon(settle);
            return;
          }
          rustx_report("html", root.innerHTML);
          document.querySelector("#shout").click();
          rustx_report("clicked", rustx_shared("clicked"));
        };
        rustx_soon(settle);
      }
    </script>
  </body>
</html>
