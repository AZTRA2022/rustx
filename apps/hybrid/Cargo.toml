[package]
name = "hybrid"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A page where Rust and JavaScript own one DOM between them."

[dependencies]
rustx = { package = "rustx-app", path = "../../crates/rustx" }
rustx-dom = { path = "../../crates/rustx-dom" }
# Named by the generated pages, never by a line a developer writes.
rustx-engine = { path = "../../crates/rustx-engine" }
