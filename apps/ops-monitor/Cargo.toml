[package]
name = "ops-monitor"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Remote resource tracking for the agents a machine runs: CPU, RAM, disk, network, with an alert when one crosses a line."

[dependencies]
rustx = { package = "rustx-app", path = "../../crates/rustx" }
# 0.40 and not 0.32: the older line depends on `windows` 0.57, and a
# second, semver-incompatible `windows` in the workspace graph makes
# `rustx-os` — which asks for 0.62 with a long feature list — compile
# against the wrong one and fail on `Win32::Foundation::BOOL`. One
# `windows` in the graph, and its features are the union of what asks
# for them.
sysinfo = "0.40"
