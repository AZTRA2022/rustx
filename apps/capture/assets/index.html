<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Console</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #16161a;
        color: #fffffe;
      }
      header {
        display: block;
        padding: 0.8rem 1.2rem;
        border-bottom: 1px solid #2e2f3e;
        color: #94a1b2;
      }
      section { padding: 1.2rem; }
      ul { list-style: none; padding: 0; display: grid; gap: 0.5rem; }
      .device { cursor: pointer; background: #242629; padding: 0.6rem 1rem; border-radius: 6px; }
      button { font: inherit; border: 0; border-radius: 6px; background: #7f5af0; color: #fffffe; padding: 0.5rem 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <!-- The screens are app/page.rsx and app/device/[id]/page.rsx, and
         the frame around them is app/layout.rsx. Nothing here is. -->
    <div id="app"></div>
    <script>
      if (capture_scenario() === "page") {
        const preview = () => document.querySelector("#preview");
        const devices = () => document.querySelectorAll(".device");
        const frame = (then) => requestAnimationFrame(() => requestAnimationFrame(then));

        // Waited for, not assumed. Two frames are usually enough for a
        // navigation to land, and a machine where they are not cost
        // every test in this file sixty seconds and said nothing about
        // why.
        const waitFor = (selector, then) => {
          const look = () => {
            if (document.querySelector(selector) === null) {
              requestAnimationFrame(look);
              return;
            }
            then();
          };
          look();
        };

        const settle = () => {
          if (devices().length < 3) {
            requestAnimationFrame(settle);
            return;
          }
          // Click the first device. Nothing in the page knows what that
          // opens: the list calls `navigate`.
          devices()[0].click();

          waitFor("#preview", () => {
            capture_report("preview_title", preview().textContent);
            capture_report("selected_in_preview", document.querySelector("#selected-in-preview").textContent);

            // Back to the list, which closes the stream the preview had
            // opened — because the preview was holding it, not because
            // anybody said so.
            document.querySelector("#back").click();
            waitFor("#selected-in-list", () => {
              capture_report("selected_in_list", document.querySelector("#selected-in-list").textContent);

              // Waited for rather than assumed: the bar ticks every 50ms
              // and this scenario can get here sooner than that.
              const ticked = () => {
                if (Number(capture_ticks()) < 1) {
                  requestAnimationFrame(ticked);
                  return;
                }
                capture_report("ticks_after_navigate", capture_ticks());
                capture_report("layout_starts", capture_layout_starts());
                capture_report("closed_streams", capture_closed_streams());

                // One more leg: the same route with another parameter.
                // `/device/Webcam` to `/device/Micro` is one component
                // rendered twice, so what the first device opened has
                // to close before the second one is shown.
                devices()[0].click();
                waitFor("#other", () => {
                  document.querySelector("#other").click();
                  const switched = () => {
                    if (preview() === null || preview().textContent !== "Micro") {
                      requestAnimationFrame(switched);
                      return;
                    }
                    capture_report("preview_after_param_change", preview().textContent);
                    capture_report("closed_after_param_change", capture_closed_streams());
                  };
                  switched();
                });
              };
              ticked();
            });
          });
        };
        requestAnimationFrame(settle);
      }
    </script>
  </body>
</html>
