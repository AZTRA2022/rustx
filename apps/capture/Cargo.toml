[package]
name = "capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Two screens, a layout that outlives them, and a stream that closes itself."

[dependencies]
rustx = { path = "../../crates/rustx" }
rustx-dom = { path = "../../crates/rustx-dom" }
# Named by the generated pages, never by a line a developer writes.
rustx-engine = { path = "../../crates/rustx-engine" }

[build-dependencies]
rustx-build = { path = "../../crates/rustx-build" }
