<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Counter</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        gap: 1rem;
        background: #16161a;
        color: #fffffe;
      }
      button {
        font: inherit;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 6px;
        background: #7f5af0;
        color: #fffffe;
        cursor: pointer;
      }
      ul { list-style: none; display: flex; gap: 0.5rem; padding: 0; }
    </style>
  </head>
  <body>
    <!-- The page is written in app/page.rsx. Nothing below is. -->
    <div id="first"></div>
    <div id="second"></div>
    <div id="rows"></div>
    <script>
      if (counter_scenario() === "page") {
        const ready = () => document.querySelector("#first button");
        const settle = () => {
          if (!ready()) {
            requestAnimationFrame(settle);
            return;
          }
          const first = document.querySelector("#first button");
          first.click();
          first.click();
          first.click();

          requestAnimationFrame(() => {
            counter_report("after_three_clicks", first.textContent);
            counter_report("first", first.textContent);
            counter_report("second", document.querySelector("#second button").textContent);

            // Click the third row twice, then move it to the front.
            const row = () => document.querySelectorAll("#rows li button");
            row()[2].click();
            row()[2].click();
            requestAnimationFrame(() => {
              counter_rotate();
              requestAnimationFrame(() => {
                counter_report("moved_item_count", row()[0].textContent);
              });
            });
          });
        };
        requestAnimationFrame(settle);
      }
    </script>
  </body>
</html>
