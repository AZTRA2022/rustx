<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Monitor</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        gap: 1rem;
        background: #16161a;
        color: #fffffe;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 0.8rem 1.2rem;
        border-bottom: 1px solid #2e2f3e;
        color: #94a1b2;
      }
      #panel { font-size: 3rem; margin: 0; }
    </style>
  </head>
  <body>
    <!-- The page is written in app/page.rsx. Nothing below is. -->
    <header>ticks <span id="header-host"></span></header>
    <div id="panel-host"></div>
    <script>
      // The hosts are named apart from the elements the components
      // return, which carry #panel and #header themselves.
      if (monitor_scenario() === "page") {
        const panel = () => document.querySelector("#panel");
        const header = () => document.querySelector("#header");

        // Wait until the thread has driven the screen a few times.
        const settle = () => {
          if (!panel() || Number(panel().textContent) < 3) {
            requestAnimationFrame(settle);
            return;
          }
          monitor_report("ticks", panel().textContent);
          monitor_report("panel", panel().textContent);
          monitor_report("header", header().textContent);

          // The panel leaves the screen. Nothing stops the thread by
          // name: its token was a value the panel kept.
          monitor_unmount_panel();

          // What the thread posted before it was cancelled is still in
          // the frame queue and lands on the next frames; that is the
          // coalescing working, not the thread surviving. So the count
          // is read once it has settled, and what is being watched is
          // whether it moves after that.
          setTimeout(() => {
            const settled = Number(monitor_ticks());
            setTimeout(() => {
              const after = Number(monitor_ticks());
              monitor_report("ticks_after_settling", String(after - settled));
              monitor_report("ticking_after_unmount", after > settled ? "yes" : "no");
            }, 500);
          }, 300);
        };
        requestAnimationFrame(settle);
      }
    </script>
  </body>
</html>
