<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Monitor</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        gap: 1rem;
        background: #16161a;
        color: #fffffe;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 0.8rem 1.2rem;
        border-bottom: 1px solid #2e2f3e;
        color: #94a1b2;
      }
      #panel { font-size: 3rem; margin: 0; }
    </style>
  </head>
  <body>
    <!-- The page is written in app/page.rsx. Nothing below is. -->
    
    <div id="app"></div>
    <script>
      // A scenario waits on time, not on a frame.
      //
      // `requestAnimationFrame` never fires on a machine whose
      // compositor produces no frames — a GPU process that crashes on
      // every start, a window the system has hidden — and a scenario
      // that polled with it waited for ever while the application
      // underneath it was working perfectly. The framework drives its
      // own frames from a timer when that happens; so does this.
      const rustx_soon = (then) => setTimeout(then, 16);
      // The hosts are named apart from the elements the components
      // return, which carry #panel and #header themselves.
      if (rustx_scenario() === "page") {
        const panel = () => document.querySelector("#panel");
        const header = () => document.querySelector("#header");

        // Wait until the thread has driven the screen a few times.
        const settle = () => {
          if (!panel() || Number(panel().textContent) < 3) {
            rustx_soon(settle);
            return;
          }
          rustx_report("ticks", panel().textContent);
          rustx_report("panel", panel().textContent);
          rustx_report("header", header().textContent);

          // The page leaves the screen. Nothing stops the thread by
          // name: its token was a value the panel kept.
          document.querySelector("#leave").click();

          // What the thread posted before it was cancelled is still in
          // the frame queue and lands on the next frames; that is the
          // coalescing working, not the thread surviving. So the count
          // is read once it has settled, and what is being watched is
          // whether it moves after that.
          setTimeout(() => {
            const settled = Number(rustx_shared("ticks"));
            setTimeout(() => {
              const after = Number(rustx_shared("ticks"));
              rustx_report("ticks_after_settling", String(after - settled));
              rustx_report("ticking_after_unmount", after > settled ? "yes" : "no");
            }, 500);
          }, 300);
        };
        rustx_soon(settle);
      }
    </script>
  </body>
</html>
